<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .card {
        display: flex;
        justify-content: center;
        align-items: center;
        /* border-radius:7px; */
        margin: 0;
        padding: 0;
        max-width: fit-content;
        height: 5.9rem;
        width: 36rem;
        border: 1px solid black;
    }

    .card .text h1 {
        font-size: 1.28rem;
        margin: 3px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 0;
    }
    .card .image {
        position: relative;
    }
    .card .capsule {
        position: absolute;
        z-index: 10;
        bottom: 2px;
        right: 1px;
        background-color: rgba(0, 0, 0, 0.69);
        color: white;
        margin: 2px 2px;
        font-size: 0.69rem;
        border-radius: 2px;
    }

</style>

<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <img style="border-radius: 7px; width: 150px    ;"
                    src="https://i.ytimg.com/vi/gRLdHSabW3o/hqdefault.jpg?sqp=-oaymwEmCKgBEF5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&rs=AOn4CLBOkIyACIrUQH4WItgmM-x89Ebw2Q"
                    alt="">
                    <div class="capsule">24:12</div>
            </div>
            <div class="text">
                <h1>JavaScript Exercise 13 - Solution & Shoutouts | Sigma Web Development Course - Tutorial #77</h1>
                <p>CodeWithHarry . 727k views . 2 month ago</p>
            </div>
        </div>
    </div>
</body>
<script src="scirpt.js"></script>
</html>
