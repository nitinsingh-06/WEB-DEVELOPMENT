<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid 2</title>
</head>
<style>
    .container {
        border: 2px solid black;
        display: grid;
        grid-template-areas: "nav nav nav"
            "side article article"
            "footer footer footer";

    }

    .item {
        border: 1px solid red;
        height: 55px;
    }

    .item-1 {
        grid-area: nav;
        background-color: aqua;
    }

    .item-2 {
        grid-area: side;
        background-color: antiquewhite;
    }

    .item-3 {
        grid-area: article;
    }

    .item-4 {
        grid-area: footer;
    }

    .item-5 {}




    .containern {
        border: 2px solid black;
        margin-top: 50px;
        display: grid;
        /* grid-template-areas: "nav nav nav"
            "side article article"
            "footer footer footer"; */
            grid-template-rows: 100px 100px 100px;
    }

    .itemn {
        border: 1px solid red;
        height: 55px;
    }


    .items-1 {
        grid-area: nav;
        background-color: aqua;
    }

    .items-2 {
        grid-area: side;
        background-color: antiquewhite;
    }

    .items-3 {
        grid-area: article;
    }

    .items-4 {
        grid-area: footer;
    }

    .items-5 {
        grid-area: nav;
    }
</style>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
    </div>
    <div class="containern">
        <div class="itemn items-1">1</div>
        <div class="itemn items-2">2</div>
        <div class="itemn items-3">3</div>
        <div class="itemn items-4">4</div>
        <div class="itemn items-5">5</div>
    </div>
</body>

</html>
