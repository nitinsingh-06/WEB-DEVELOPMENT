<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css Display Properties</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        ;
    }

    .box {
        border: 2px solid blue;
        background-color: rgba(0, 255, 255, 0.295);
        display: inline-block;

        padding: 45px;
        padding-top: 45px;
        margin: 34px;
    }

    .box1 {
        visibility: hidden;
        border: 2px solid blue;
        background-color: rgba(0, 255, 255, 0.295);
        display: inline-block;

        padding: 45px;
        padding-top: 45px;
        margin: 34px;
    }
</style>

<body>
    <div class="box">
        I am a Box
    </div>
    <div class="box">
        also a nice box
    </div>
    <div class="box1">Also I am another box</div>
    <span>I am good</span>
    <span>boy</span>
</body>

</html>
